# ============================================================
# ~/.tmux.conf
# Neovim-synced tmux configuration
# Migrated from HaPhanBaoMinh/nvim with optimizations
# ============================================================

# ============================================================
# Prefix — C-b
# ============================================================
set -g prefix C-b
unbind C-Space
unbind C-b
bind C-b send-prefix
unbind C-a
unbind C-z  # give Ctrl-z back to shell (suspend)

# ============================================================
# Terminal
# ============================================================
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm*:Tc"
set -g default-shell /bin/bash
set -g default-command ""

# ============================================================
# Clipboard — works in tmux 3.0+
# Mouse drag copies selection to system clipboard automatically
# ============================================================
set -g set-clipboard on

# ============================================================
# Mouse
# ============================================================
set -g mouse on

# ============================================================
# History
# ============================================================
set -g history-limit 50000

# ============================================================
# Smart pane navigation — Ctrl+hjkl passthrough to nvim
# When in nvim, send the key through. When in tmux, switch pane.
# This is the key to seamless Ctrl+hjkl in both tools.
# ============================================================
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

# Normal mode: if vim → pass through, else → switch pane
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -n C-\\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

# Copy mode: pass through to nvim (Ctrl-\ = switch pane when not in vim)
bind -T copy-mode-vi C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -T copy-mode-vi C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -T copy-mode-vi C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -T copy-mode-vi C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# ============================================================
# Keybindings — Panes (vim-style, prefix based)
# ============================================================
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes (repeatable with -r flag, won't consume next key)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ============================================================
# Keybindings — Windows
# ============================================================
# Create window in current path
bind c new-window -c "#{pane_current_path}"
# Splits — v=vertical (|), h=horizontal (-), open in current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
# Kill pane / window
bind x kill-pane
bind X kill-window

# Navigate windows (repeatable)
bind -r n next-window
bind -r p previous-window
# Swap windows
bind -r N swap-window -t +1
bind -r P swap-window -t -1

# ============================================================
# Keybindings — Copy Mode (vi-style)
# ============================================================
setw -g mode-keys vi

# Mouse: drag to select, release to copy + exit copy-mode
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel \; run "tmux save-buffer - | xclip -selection clipboard -in"
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi r send-keys -X rectangle-toggle

# Paste from clipboard (also works without xsel)
bind p run "tmux save-buffer - | xclip -selection clipboard -in" \; display "Copied!"

# ============================================================
# Keybindings — Session
# ============================================================
bind d detach
bind s choose-tree -s
bind w choose-tree -w

# ============================================================
# Display / UI
# ============================================================
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename on
set -g set-titles on
set -g set-titles-string "#{session_name}:#{window_name}:#{pane_title}"

# ============================================================
# Status bar — TokyoNight-inspired dark theme (colours 239/229/75)
# ============================================================
set -g status on
set -g status-interval 1
set -g status-position bottom
set -g status-style bg=colour237,fg=colour223
set -g status-left-length 50
set -g status-right-length 80

# Left: session name + current window with prefix indicator
set -g status-left "#[fg=colour229,bold,bg=colour239] #S #[fg=colour239,bg=colour237,nobold]│"
set -ag status-left "#[fg=colour246,bg=colour237]#{?client_prefix,#[fg=colour214]●, }#{window_flags}#{window_name} #[fg=colour237]"

# Window list separator
set -g window-status-separator "  "

# Window states
set -g window-status-style fg=colour244,bg=colour237
set -g window-status-current-style fg=colour229,bg=colour239,bold
set -g window-status-activity-style fg=yellow,bg=colour237
set -g window-status-bell-style fg=red,bg=colour237
set -g window-status-format "#[fg=colour244] #I:#{window_name} "
set -g window-status-current-format "#[fg=colour229,bold] #I:#{window_name} "

# Right: zoom indicator + clock
set -g status-right "#[fg=colour239,bg=colour237] "
set -ag status-right "#[fg=colour246,bg=colour239] #{?window_zoomed_flag,🔍,} "
set -ag status-right "#[fg=colour247,bg=colour239] %H:%M:%S "
set -ag status-right "#[fg=colour241,bg=colour239] %d %b "

# Pane border colours
set -g pane-border-style fg=colour239
set -g pane-active-border-style fg=colour75
set -g message-command-style fg=colour229,bg=colour239
set -g message-style fg=black,bg=colour75
setw -g clock-mode-colour colour75
setw -g clock-mode-style 24

# ============================================================
# Performance
# ============================================================
set -sg escape-time 0       # instant Esc in nvim (critical)
set -sg repeat-time 300      # repeatable without re-pressing prefix
set -g focus-events on
set -g display-time 1500
set -g display-panes-time 800

# ============================================================
# Synchronize panes (C-b E)
# ============================================================
bind E setw synchronize-panes \; display "synchronize-panes #{?pane_synchronized,ON,OFF}"

# ============================================================
# Zoom pane (C-b z)
# ============================================================
bind z resize-pane -Z \; display "zoom #{?window_zoomed_flag,ON,OFF}"

# ============================================================
# Leader groups — C-b <key> for contextual sub-actions
# Each group shows a persistent hint bar, then exits on action.
# ============================================================

# --- Copy mode (C-b y) ---
unbind -q -T root Space
unbind -q -T root y
unbind -q -T root r
unbind -q -T root d
unbind -q -T root s
unbind -q -T root w
unbind -q -T root p
unbind -q -T root t

bind y display-message "" \; copy-mode -e \; switch-client -T root

# --- Leader hint bar: C-b Space ---
# Shows all available groups for 10 seconds
bind Space display-message -d 10000 \
  "leader: s=split | w=windows | p=panes | t=sessions | y=copy | z=zoom | r=reload | d=detach" \
  \; switch-client -T root

# Reload config (C-b r)
bind r display-message "Reloading..." \; source-file ~/.tmux.conf \; display "tmux.conf reloaded!"

# Detach (C-b d)
bind d display-message "" \; detach-client

# --- split group: C-b s ---
bind s display-message -d 0 "split: v=vertical | h=horizontal | x=close | q/Esc=quit" \; switch-client -T split
bind -T split v display-message "" \; split-window -h -c "#{pane_current_path}" \; switch-client -T root
bind -T split h display-message "" \; split-window -v -c "#{pane_current_path}" \; switch-client -T root
bind -T split x display-message "" \; kill-pane \; switch-client -T root
bind -r -T split H display-message "" \; resize-pane -L 8 \; switch-client -T root
bind -r -T split J display-message "" \; resize-pane -D 4 \; switch-client -T root
bind -r -T split K display-message "" \; resize-pane -U 4 \; switch-client -T root
bind -r -T split L display-message "" \; resize-pane -R 8 \; switch-client -T root
bind -T split q display-message "" \; switch-client -T root
bind -T split Escape display-message "" \; switch-client -T root

# --- windows group: C-b w ---
bind w display-message -d 0 "windows: n=new | c/w=choose | x=close | j/k=next/prev | 0-9=jump | q/Esc=quit" \; switch-client -T windows
bind -T windows n display-message "" \; new-window -c "#{pane_current_path}" \; switch-client -T root
bind -T windows c display-message "" \; choose-window \; switch-client -T root
bind -T windows w display-message "" \; choose-window \; switch-client -T root
bind -T windows x display-message "" \; kill-window \; switch-client -T root
bind -T windows j display-message "" \; next-window \; switch-client -T root
bind -T windows k display-message "" \; previous-window \; switch-client -T root
bind -T windows r display-message "" \; command-prompt -I "#{window_name}" "rename-window -- '%%'" \; switch-client -T root
bind -T windows 0 display-message "" \; select-window -t :0 \; switch-client -T root
bind -T windows 1 display-message "" \; select-window -t :1 \; switch-client -T root
bind -T windows 2 display-message "" \; select-window -t :2 \; switch-client -T root
bind -T windows 3 display-message "" \; select-window -t :3 \; switch-client -T root
bind -T windows 4 display-message "" \; select-window -t :4 \; switch-client -T root
bind -T windows 5 display-message "" \; select-window -t :5 \; switch-client -T root
bind -T windows 6 display-message "" \; select-window -t :6 \; switch-client -T root
bind -T windows 7 display-message "" \; select-window -t :7 \; switch-client -T root
bind -T windows 8 display-message "" \; select-window -t :8 \; switch-client -T root
bind -T windows 9 display-message "" \; select-window -t :9 \; switch-client -T root
bind -T windows q display-message "" \; switch-client -T root
bind -T windows Escape display-message "" \; switch-client -T root

# --- panes group: C-b p ---
bind p display-message -d 0 "panes: n=new | c/p=choose | h/j/k/l=move | o=last | x=close | q/Esc=quit" \; switch-client -T panes
bind -T panes n display-message "" \; split-window -h -c "#{pane_current_path}" \; switch-client -T root
bind -T panes c display-message "" \; choose-tree -Zw \; switch-client -T root
bind -T panes p display-message "" \; choose-tree -Zw \; switch-client -T root
bind -T panes h display-message "" \; select-pane -L \; switch-client -T root
bind -T panes j display-message "" \; select-pane -D \; switch-client -T root
bind -T panes k display-message "" \; select-pane -U \; switch-client -T root
bind -T panes l display-message "" \; select-pane -R \; switch-client -T root
bind -T panes o display-message "" \; last-pane \; switch-client -T root
bind -T panes x display-message "" \; kill-pane \; switch-client -T root
bind -T panes q display-message "" \; switch-client -T root
bind -T panes Escape display-message "" \; switch-client -T root

# --- sessions group: C-b t ---
bind t display-message -d 0 "sessions: n=new/switch | c/t=choose | x=kill | j/k=next/prev | q/Esc=quit" \; switch-client -T sessions
bind -T sessions n display-message "" \; command-prompt -p "session name" "new-session -A -s '%%'" \; switch-client -T root
bind -T sessions c display-message "" \; choose-tree -s \; switch-client -T root
bind -T sessions t display-message "" \; choose-tree -s \; switch-client -T root
bind -T sessions j display-message "" \; switch-client -n \; switch-client -T root
bind -T sessions k display-message "" \; switch-client -p \; switch-client -T root
bind -T sessions x display-message "" \; confirm-before -p "kill session #S? (y/n)" "kill-session" \; switch-client -T root
bind -T sessions q display-message "" \; switch-client -T root
bind -T sessions Escape display-message "" \; switch-client -T root

